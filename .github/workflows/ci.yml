name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily security scan at 2 AM
  workflow_dispatch:

# ============================================================
# 环境配置
# ============================================================
env:
  NODE_VERSION: '20'
  NODE_ENV: test
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ============================================================
  # 阶段 1: Lint - 代码质量检查
  # ============================================================
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Backend ESLint
      - name: Backend ESLint
        run: |
          cd backend
          npm ci --prefer-offline
          npx eslint src/ --format stylish --max-warnings 0

      # Frontend ESLint
      - name: Frontend ESLint
        run: |
          cd frontend
          npm ci --prefer-offline
          npx eslint . --max-warnings 0

      # Type Check (Frontend)
      - name: Frontend TypeScript Check
        run: |
          cd frontend
          npx tsc --noEmit

      # JSON Schema Validation
      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('backend/package.json'))" && echo "backend/package.json OK"
          node -e "JSON.parse(require('fs').readFileSync('frontend/package.json'))" && echo "frontend/package.json OK"

  # ============================================================
  # 阶段 2: Test - 单元测试和集成测试
  # ============================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci --prefer-offline

      - name: Backend Unit Tests
        run: |
          cd backend
          # Run specific test directories to avoid empty test suites
          npx jest tests/unit/hitl.test.js tests/unit/a2a.test.js tests/unit/api.test.js \
            --coverage --coverageReporters=text-summary --coverageReporters=lcov --passWithNoTests
        continue-on-error: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage/
            backend/test-results/
          retention-days: 7

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --prefer-offline

      - name: Frontend Unit Tests (Vitest)
        run: |
          cd frontend
          npx vitest run --coverage --reporter=junit
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            frontend/test-results/
            frontend/coverage/
          retention-days: 7

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          cd frontend
          npx playwright install chromium --with-deps

      - name: Run E2E Tests
        run: |
          cd frontend
          npx playwright test --reporter=list
        continue-on-error: true

      - name: Upload E2E Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

  # ============================================================
  # 阶段 3: Build - 容器镜像构建
  # ============================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.date }}
            CI_COMMIT_SHA=${{ github.sha }}

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend

      - name: Output image digest
        run: |
          echo "Backend image: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-frontend]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.date }}
            CI_COMMIT_SHA=${{ github.sha }}

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend

      - name: Output image digest
        run: |
          echo "Frontend image: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"

  # ============================================================
  # 阶段 4: Security - 安全扫描
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run npm audit
        run: |
          cd backend && npm audit --audit-level=high --json > npm-audit-backend.json || true
          cd ../frontend && npm audit --audit-level=high --json > npm-audit-frontend.json || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            backend/npm-audit-backend.json
            frontend/npm-audit-frontend.json
          retention-days: 30

  # ============================================================
  # 阶段 5: Deploy Staging (Manual)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.chat.toy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Deploy Backend to Staging
        run: |
          kubectl set image deployment/ai-chat-backend \
            backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            -n ai-chat-staging
          kubectl rollout status deployment/ai-chat-backend -n ai-chat-staging --timeout=5m

      - name: Deploy Frontend to Staging
        run: |
          kubectl set image deployment/ai-chat-frontend \
            frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} \
            -n ai-chat-staging
          kubectl rollout status deployment/ai-chat-frontend -n ai-chat-staging --timeout=5m

      - name: Health Check
        run: |
          sleep 30
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://staging.chat.toy/health || echo "000")
            echo "Health check attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Staging health check passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed!"
          exit 1

  # ============================================================
  # 阶段 6: Deploy Production (Manual)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://chat.toy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Deploy Backend to Production
        run: |
          kubectl set image deployment/ai-chat-backend \
            backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            -n ai-chat-production
          kubectl rollout status deployment/ai-chat-backend -n ai-chat-production --timeout=10m

      - name: Deploy Frontend to Production
        run: |
          kubectl set image deployment/ai-chat-frontend \
            frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} \
            -n ai-chat-production
          kubectl rollout status deployment/ai-chat-frontend -n ai-chat-production --timeout=10m

      - name: Health Check
        run: |
          sleep 60
          for i in {1..15}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://chat.toy/health || echo "000")
            echo "Health check attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Production health check passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed, triggering rollback..."
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/ai-chat-backend -n ai-chat-production
          kubectl rollout undo deployment/ai-chat-frontend -n ai-chat-production

  # ============================================================
  # 通知
  # ============================================================
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Send failure notification
        if: needs.deploy-production.result == 'failure'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text": "GitHub Actions Deployment Failed: ${{ github.repository }} (${{ github.ref_name }})"}'

      - name: Send success notification
        if: needs.deploy-production.result == 'success'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text": "Deployment Success: ${{ github.repository }} -> Production (${{ github.sha }})"}'