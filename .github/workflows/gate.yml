name: GATE

# 触发: PR 打开/同步 + push 到 master/release
on:
  pull_request:
    branches: [master, release/**]
  push:
    branches: [master, release/**]

jobs:
  gate:
    name: GATE 15/15 商业级门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "wget -qO- http://localhost:6333/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: 安装 backend 依赖
        working-directory: backend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 安装 frontend 依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 后端单测
        working-directory: backend
        run: pnpm test

      - name: 前端单测
        working-directory: frontend
        run: pnpm test

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 综合回归测试
        run: node tests/comprehensive-test.js

      - name: GATE 15/15 验收
        env:
          # 强制使用 mock key 跑 (无真实 API)
          MINIMAX_API_KEY: test-mock-key-for-gate-only
          DISABLE_RATE_LIMIT: true
        run: |
          # 启动 backend (后台)
          cd backend
          nohup node src/index.js > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          sleep 8

          # 启动 metrics dashboard (后台)
          cd ..
          nohup node scripts/metrics-dashboard.mjs > /tmp/metrics.log 2>&1 &
          METRICS_PID=$!
          sleep 3

          # 启动 frontend (后台, dev mode)
          cd frontend
          nohup pnpm dev > /tmp/frontend.log 2>&1 &
          FRONTEND_PID=$!
          sleep 20

          # 跑 GATE
          cd ..
          bash scripts/online-gate.sh

          GATE_EXIT=$?

          # 清理
          kill $BACKEND_PID $METRICS_PID $FRONTEND_PID 2>/dev/null || true
          exit $GATE_EXIT
