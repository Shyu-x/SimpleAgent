# ============================================================
# AI Chat 玩具 - GitLab CI/CD 流水线配置
# ============================================================
# 版本: v1.1.0
# 更新: 2026-05-13
# 说明: 前后端集成流水线，模块级并行构建、测试门禁、灰度发布
# ============================================================

# 全局变量
variables:
  # Docker 配置
  DOCKER_REGISTRY: registry.gitlab.com
  DOCKER_IMAGE_PREFIX: ai-chat
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_DRIVER: overlay2

  # Kubernetes 配置
  K8S_NAMESPACE_STAGING: ai-chat-staging
  K8S_NAMESPACE_PRODUCTION: ai-chat-production
  K8S_STAGING_CLUSTER: staging-cluster
  K8S_PRODUCTION_CLUSTER: production-cluster

  # 测试配置
  JEST_JUNIT_OUTPUT: test-results/junit.xml
  JEST_COVERAGE_OUTPUT: test-results/coverage

  # 前端配置
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV_TEST: test

  # Git 配置
  GIT_DEPTH: 0

  # 缓存配置
  CACHE_COMPRESSION_LEVEL: "low"

# ============================================================
# 流水线触发器
# ============================================================
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^develop.*$/
    - if: $CI_COMMIT_BRANCH =~ /^feature.*$/
    - if: $CI_COMMIT_BRANCH =~ /^hotfix.*$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

# ============================================================
# 流水线阶段
# ============================================================
stages:
  - lint
  - test
  - build
  - security
  - deploy-staging
  - deploy-production

# ============================================================
# 全局默认配置
# ============================================================
default:
  timeout: "1h"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure

# ============================================================
# 阶段 1: Lint
# ============================================================

# 1.1 Commit Message 规范校验
commitlint:
  stage: lint
  image: node:20-alpine
  allow_failure: false
  before_script:
    - echo "=== Commitlint 检查 ==="
    - npm install -g @commitlint/cli@latest @commitlint/config-conventional@latest
  script:
    - |
      COMMIT_MSG=$(git log -1 --format=%B)
      echo "Commit Message: $COMMIT_MSG"
      echo "$COMMIT_MSG" | npx @commitlint/cli --verbose
  only:
    - merge_request_event
    - push
  tags:
    - docker

# 1.2 Backend ESLint
eslint:backend:
  stage: lint
  image: node:20-alpine
  allow_failure: false
  before_script:
    - echo "=== Backend ESLint ==="
    - cd backend
    - npm ci --cache node_modules/.npm --prefer-offline 2>/dev/null || npm install
  script:
    - |
      cd backend
      if [ -f "eslint.config.js" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ]; then
        npx eslint src/ --format stylish --max-warnings 0
      else
        echo "WARNING: Backend ESLint 配置未找到，跳过检查"
      fi
  only:
    changes:
      - backend/**/*
  tags:
    - docker
  cache:
    key: backend-eslint
    paths:
      - backend/node_modules/
    policy: pull-push

# 1.3 Frontend ESLint
eslint:frontend:
  stage: lint
  image: node:20-alpine
  allow_failure: false
  before_script:
    - echo "=== Frontend ESLint ==="
    - cd frontend
    - npm ci --cache node_modules/.npm --prefer-offline 2>/dev/null || npm install
  script:
    - |
      cd frontend
      npx eslint . --max-warnings 0 2>/dev/null || echo "WARNING: Frontend ESLint 检查发现问题"
  only:
    changes:
      - frontend/src/**/*
      - frontend/eslint.config.mjs
      - frontend/package.json
  tags:
    - docker
  cache:
    key: frontend-eslint
    paths:
      - frontend/node_modules/
    policy: pull-push

# 1.4 Type Check (Frontend)
typecheck:frontend:
  stage: lint
  image: node:20-alpine
  allow_failure: true
  before_script:
    - echo "=== Frontend TypeScript 类型检查 ==="
    - cd frontend
    - npm ci --cache node_modules/.npm --prefer-offline 2>/dev/null || npm install
  script:
    - cd frontend && npx tsc --noEmit 2>/dev/null || echo "WARNING: TypeScript 类型检查发现问题"
  only:
    changes:
      - frontend/src/**/*
      - frontend/tsconfig.json
  tags:
    - docker
  cache:
    key: frontend-typecheck
    paths:
      - frontend/node_modules/
    policy: pull-push

# 1.5 JSON Schema 校验
json-validate:
  stage: lint
  image: node:20-alpine
  allow_failure: false
  before_script:
    - echo "=== JSON Schema 校验 ==="
  script:
    - |
      node -e "JSON.parse(require('fs').readFileSync('backend/package.json'))" && echo "backend/package.json OK"
      node -e "JSON.parse(require('fs').readFileSync('frontend/package.json'))" && echo "frontend/package.json OK"
  only:
    changes:
      - backend/package.json
      - frontend/package.json
  tags:
    - docker

# ============================================================
# 阶段 2: Test
# ============================================================

# 2.0 通用后端测试模板
.test-backend-template: &test-backend-template
  stage: test
  image: node:20-alpine
  allow_failure: false
  before_script:
    - echo "=== ${MODULE_NAME} 模块测试 ==="
    - cd backend
    - npm ci --cache node_modules/.npm --prefer-offline 2>/dev/null || npm install
  script:
    - |
      cd backend
      npx jest --coverage --coverageReporters=text-summary --coverageReporters=lcov --coverageReporters=jest-junit 2>/dev/null || true
  after_script:
    - echo "=== 后端测试结果摘要 ==="
  coverage: '/(?:%2?s)\s*\d+/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/test-results/
      - backend/coverage/
    reports:
      junit: backend/test-results/junit.xml
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  timeout: "30m"

# 2.1 Backend 核心模块测试
test:backend:
  <<: *test-backend-template
  variables:
    MODULE_NAME: backend
  only:
    changes:
      - backend/src/**/*.js
      - backend/package.json

# 2.2 Frontend 单元测试 (Vitest)
test:frontend:unit:
  stage: test
  image: node:20-alpine
  allow_failure: true
  before_script:
    - echo "=== Frontend 单元测试 ==="
    - cd frontend
    - npm ci --cache node_modules/.npm --prefer-offline 2>/dev/null || npm install
  script:
    - |
      cd frontend
      npx vitest run --coverage --reporter=junit 2>/dev/null || echo "WARNING: Frontend 单元测试未配置或失败"
  after_script:
    - echo "=== Frontend 测试结果摘要 ==="
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/test-results/
      - frontend/coverage/
  only:
    changes:
      - frontend/src/**/*
      - frontend/package.json
  tags:
    - docker
  cache:
    key: frontend-test
    paths:
      - frontend/node_modules/
    policy: pull-push
  timeout: "30m"

# 2.3 Frontend E2E 测试 (Playwright)
test:frontend:e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.0-jammy
  allow_failure: true
  before_script:
    - echo "=== Frontend E2E 测试 ==="
    - cd frontend
    - npm ci --cache node_modules/.npm --prefer-offline 2>/dev/null || npm install
  script:
    - |
      cd frontend
      npx playwright install chromium --with-deps 2>/dev/null || true
      npx playwright test --reporter=list 2>/dev/null || echo "WARNING: E2E 测试失败"
  after_script:
    - echo "=== E2E 测试结果摘要 ==="
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/test-results/
      - frontend/playwright-report/
  only:
    - main
    - develop
    - merge_request_event
  tags:
    - docker
  timeout: "45m"

# 2.4 集成测试
test:integration:
  stage: test
  image: node:20-alpine
  allow_failure: true
  services:
    - postgres:15-alpine
    - redis:7-alpine
  before_script:
    - echo "=== 集成测试 ==="
    - cd backend
    - npm ci --cache node_modules/.npm --prefer-offline 2>/dev/null || npm install
  script:
    - |
      cd backend
      export DATABASE_URL="postgresql://postgres:postgres@postgres:5432/test_db"
      export REDIS_URL="redis://redis:6379"
      npx jest --config jest.integration.config.js --runInBand 2>/dev/null || echo "WARNING: 集成测试失败"
  only:
    - main
    - develop
    - merge_request_event
  tags:
    - docker
  timeout: "1h"

# ============================================================
# 阶段 3: Build
# ============================================================

# 3.0 通用构建模板
.build-template: &build-template
  stage: build
  image: docker:24.0.7
  allow_failure: false
  before_script:
    - echo "=== 构建 ${MODULE_NAME} 模块 ==="
    - docker info
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $DOCKER_REGISTRY
  script:
    - |
      DOCKERFILE_PATH="${DOCKERFILE:-Dockerfile}"
      MODULE_DIR="${MODULE_DIR:-.}"

      echo "模块: ${MODULE_NAME}"
      echo "Dockerfile: ${DOCKERFILE_PATH}"
      echo "目录: ${MODULE_DIR}"

      docker build \
        --pull \
        --cache-from ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/${MODULE_NAME}:latest \
        --tag ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/${MODULE_NAME}:${DOCKER_TAG} \
        --tag ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/${MODULE_NAME}:latest \
        --build-arg BUILD_ENV=${CI_COMMIT_REF_NAME} \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg CI_COMMIT_SHA=${CI_COMMIT_SHA} \
        -f ${DOCKERFILE_PATH} \
        ${MODULE_DIR}

      docker push ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/${MODULE_NAME}:${DOCKER_TAG}
      docker push ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/${MODULE_NAME}:latest

      echo "=== 构建完成: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/${MODULE_NAME}:${DOCKER_TAG} ==="
  after_script:
    - docker logout || true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  tags:
    - docker
    - dind
  timeout: "30m"

# 3.1 Backend 构建
build:backend:
  <<: *build-template
  variables:
    MODULE_NAME: backend
    DOCKERFILE: backend/Dockerfile
    MODULE_DIR: backend
  only:
    changes:
      - backend/src/**/*.js
      - backend/Dockerfile
      - backend/package.json
      - backend/package-lock.json
  needs:
    - test:backend

# 3.2 Frontend 构建
build:frontend:
  <<: *build-template
  variables:
    MODULE_NAME: frontend
    DOCKERFILE: frontend/Dockerfile
    MODULE_DIR: frontend
  only:
    changes:
      - frontend/src/**/*
      - frontend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
  needs:
    - test:frontend:unit

# ============================================================
# 阶段 4: Security
# ============================================================

# 4.1 Backend 容器安全扫描
security:backend:container:
  stage: security
  image: aquasec/trivy:latest
  allow_failure: true
  before_script:
    - echo "=== Backend 容器安全扫描 ==="
  script:
    - |
      IMAGE="${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/backend:${DOCKER_TAG}"
      echo "扫描镜像: $IMAGE"
      trivy image --download-db-only || true
      trivy image \
        --format template \
        --template "@contrib/html.tpl" \
        --output "security-backend.html" \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        $IMAGE || true
      trivy image --format json --output "security-backend.json" $IMAGE || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security-backend.html
      - security-backend.json
  only:
    - main
    - develop
    - merge_request_event
  tags:
    - docker

# 4.2 Frontend 容器安全扫描
security:frontend:container:
  stage: security
  image: aquasec/trivy:latest
  allow_failure: true
  before_script:
    - echo "=== Frontend 容器安全扫描 ==="
  script:
    - |
      IMAGE="${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/frontend:${DOCKER_TAG}"
      echo "扫描镜像: $IMAGE"
      trivy image --download-db-only || true
      trivy image \
        --format template \
        --template "@contrib/html.tpl" \
        --output "security-frontend.html" \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        $IMAGE || true
      trivy image --format json --output "security-frontend.json" $IMAGE || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security-frontend.html
      - security-frontend.json
  only:
    - main
    - develop
    - merge_request_event
  tags:
    - docker

# 4.3 Backend 依赖安全扫描
security:backend:dependencies:
  stage: security
  image: node:20-alpine
  allow_failure: true
  before_script:
    - echo "=== Backend 依赖安全扫描 ==="
    - npm install -g npm-audit-html 2>/dev/null || true
  script:
    - |
      cd backend
      npm audit --json > npm-audit.json || true
      cat npm-audit.json | npm-audit-html -o npm-audit-report.html || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - backend/npm-audit.json
      - backend/npm-audit-report.html
  only:
    changes:
      - backend/package.json
      - backend/package-lock.json
  tags:
    - docker

# 4.4 Frontend 依赖安全扫描
security:frontend:dependencies:
  stage: security
  image: node:20-alpine
  allow_failure: true
  before_script:
    - echo "=== Frontend 依赖安全扫描 ==="
    - npm install -g npm-audit-html 2>/dev/null || true
  script:
    - |
      cd frontend
      npm audit --json > npm-audit.json || true
      cat npm-audit.json | npm-audit-html -o npm-audit-report.html || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - frontend/npm-audit.json
      - frontend/npm-audit-report.html
  only:
    changes:
      - frontend/package.json
      - frontend/package-lock.json
  tags:
    - docker

# 4.5 SAST 扫描
security:sast:
  stage: security
  image: node:20-alpine
  allow_failure: true
  before_script:
    - echo "=== SAST 静态分析 ==="
    - npm install -g eslint-plugin-security 2>/dev/null || true
  script:
    - |
      cd backend
      if [ -f "eslint.config.js" ]; then
        npx eslint src/ --plugin security --format json > sast-report.json || true
      fi
      cd ../frontend
      npx eslint . --plugin security --format json > sast-frontend-report.json 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - backend/sast-report.json
      - frontend/sast-frontend-report.json
  only:
    - main
    - develop
    - merge_request_event
  tags:
    - docker

# ============================================================
# 阶段 5: Deploy Staging
# ============================================================

# 5.0 通用部署模板
.deploy-template: &deploy-template
  stage: deploy-staging
  image: bitnami/kubectl:latest
  allow_failure: false
  before_script:
    - echo "=== 部署 ${MODULE_NAME} 到 ${K8S_NAMESPACE} ==="
    - kubectl config use-context ${K8S_CLUSTER}
    - kubectl version --client
  script:
    - |
      MODULE_IMAGE="${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/${MODULE_NAME}:${DOCKER_TAG}"
      DEPLOYMENT_NAME="${DEPLOYMENT_NAME:-${MODULE_NAME}-deployment}"
      CONTAINER_NAME="${CONTAINER_NAME:-${MODULE_NAME}}"

      echo "镜像: $MODULE_IMAGE"
      echo "部署: $DEPLOYMENT_NAME"

      kubectl set image \
        deployment/$DEPLOYMENT_NAME \
        $CONTAINER_NAME=$MODULE_IMAGE \
        -n $K8S_NAMESPACE \
        --record

      kubectl rollout status deployment/$DEPLOYMENT_NAME -n $K8S_NAMESPACE --timeout=10m
      kubectl rollout status deployment/$DEPLOYMENT_NAME -n $K8S_NAMESPACE

      echo "=== 部署完成 ==="
  after_script:
    - echo "=== 部署后清理 ==="
  tags:
    - kubernetes
  timeout: "15m"

# 5.1 Backend 部署到 Staging
deploy:staging:backend:
  <<: *deploy-template
  variables:
    MODULE_NAME: backend
    K8S_NAMESPACE: $K8S_NAMESPACE_STAGING
    K8S_CLUSTER: $K8S_STAGING_CLUSTER
    DEPLOYMENT_NAME: ai-chat-backend
  only:
    - main
    - develop
  needs:
    - build:backend
  when: manual
  environment:
    name: staging/backend
    url: https://staging.chat.toy
    deployment_tier: staging
  tags:
    - kubernetes

# 5.2 Frontend 部署到 Staging
deploy:staging:frontend:
  <<: *deploy-template
  variables:
    MODULE_NAME: frontend
    K8S_NAMESPACE: $K8S_NAMESPACE_STAGING
    K8S_CLUSTER: $K8S_STAGING_CLUSTER
    DEPLOYMENT_NAME: ai-chat-frontend
  only:
    - main
    - develop
  needs:
    - build:frontend
  when: manual
  environment:
    name: staging/frontend
    url: https://staging.chat.toy
    deployment_tier: staging
  tags:
    - kubernetes

# ============================================================
# 阶段 6: Deploy Production
# ============================================================

# 6.1 Backend 灰度发布
deploy:production:backend:
  <<: *deploy-template
  variables:
    MODULE_NAME: backend
    K8S_NAMESPACE: $K8S_NAMESPACE_PRODUCTION
    K8S_CLUSTER: $K8S_PRODUCTION_CLUSTER
    DEPLOYMENT_NAME: ai-chat-backend
  only:
    - main
  needs:
    - deploy:staging:backend
  when: manual
  environment:
    name: production/backend
    url: https://chat.toy
    deployment_tier: production
  tags:
    - kubernetes

# 6.2 Frontend 灰度发布
deploy:production:frontend:
  <<: *deploy-template
  variables:
    MODULE_NAME: frontend
    K8S_NAMESPACE: $K8S_NAMESPACE_PRODUCTION
    K8S_CLUSTER: $K8S_PRODUCTION_CLUSTER
    DEPLOYMENT_NAME: ai-chat-frontend
  only:
    - main
  needs:
    - deploy:staging:frontend
  when: manual
  environment:
    name: production/frontend
    url: https://chat.toy
    deployment_tier: production
  tags:
    - kubernetes

# 6.3 灰度发布 (金丝雀)
deploy:canary:backend:
  stage: deploy-production
  image: bitnami/kubectl:latest
  allow_failure: false
  before_script:
    - kubectl config use-context $K8S_PRODUCTION_CLUSTER
  script:
    - |
      MODULE_IMAGE="${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/backend:${DOCKER_TAG}"
      echo "=== 灰度发布 Backend (金丝雀) ==="
      echo "阶段 1: 10% 流量..."
      kubectl set image deployment/ai-chat-backend backend=$MODULE_IMAGE -n $K8S_NAMESPACE_PRODUCTION
      sleep 60
      echo "灰度 10% 完成，请验证..."
      echo "阶段 2: 50% 流量..."
      kubectl rollout status deployment/ai-chat-backend -n $K8S_NAMESPACE_PRODUCTION
      echo "阶段 3: 100% 流量..."
      kubectl rollout status deployment/ai-chat-backend -n $K8S_NAMESPACE_PRODUCTION
      echo "=== 灰度发布完成 ==="
  only:
    - main
  needs:
    - deploy:staging:backend
  when: manual
  tags:
    - kubernetes
  timeout: "30m"

# ============================================================
# 回滚
# ============================================================

# 回滚 Backend Staging
rollback:staging:backend:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  allow_failure: false
  before_script:
    - kubectl config use-context $K8S_STAGING_CLUSTER
    - echo "=== 回滚 Backend Staging ==="
  script:
    - |
      kubectl rollout history deployment/ai-chat-backend -n $K8S_NAMESPACE_STAGING
      kubectl rollout undo deployment/ai-chat-backend -n $K8S_NAMESPACE_STAGING
      kubectl rollout status deployment/ai-chat-backend -n $K8S_NAMESPACE_STAGING
      echo "=== 回滚完成 ==="
  environment:
    name: staging/backend
    action: rollback
  only:
    - main
    - develop
  tags:
    - kubernetes
  when: manual

# 回滚 Frontend Staging
rollback:staging:frontend:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  allow_failure: false
  before_script:
    - kubectl config use-context $K8S_STAGING_CLUSTER
    - echo "=== 回滚 Frontend Staging ==="
  script:
    - |
      kubectl rollout history deployment/ai-chat-frontend -n $K8S_NAMESPACE_STAGING
      kubectl rollout undo deployment/ai-chat-frontend -n $K8S_NAMESPACE_STAGING
      kubectl rollout status deployment/ai-chat-frontend -n $K8S_NAMESPACE_STAGING
      echo "=== 回滚完成 ==="
  environment:
    name: staging/frontend
    action: rollback
  only:
    - main
    - develop
  tags:
    - kubernetes
  when: manual

# 回滚 Backend Production
rollback:production:backend:
  stage: deploy-production
  image: bitnami/kubectl:latest
  allow_failure: false
  before_script:
    - kubectl config use-context $K8S_PRODUCTION_CLUSTER
    - echo "=== 回滚 Backend Production ==="
  script:
    - |
      kubectl rollout history deployment/ai-chat-backend -n $K8S_NAMESPACE_PRODUCTION
      sleep 5
      kubectl rollout undo deployment/ai-chat-backend -n $K8S_NAMESPACE_PRODUCTION
      kubectl rollout status deployment/ai-chat-backend -n $K8S_NAMESPACE_PRODUCTION
      echo "=== 回滚完成 ==="
  environment:
    name: production/backend
    action: rollback
  only:
    - main
  tags:
    - kubernetes
  when: manual
  timeout: "15m"

# 回滚 Frontend Production
rollback:production:frontend:
  stage: deploy-production
  image: bitnami/kubectl:latest
  allow_failure: false
  before_script:
    - kubectl config use-context $K8S_PRODUCTION_CLUSTER
    - echo "=== 回滚 Frontend Production ==="
  script:
    - |
      kubectl rollout history deployment/ai-chat-frontend -n $K8S_NAMESPACE_PRODUCTION
      sleep 5
      kubectl rollout undo deployment/ai-chat-frontend -n $K8S_NAMESPACE_PRODUCTION
      kubectl rollout status deployment/ai-chat-frontend -n $K8S_NAMESPACE_PRODUCTION
      echo "=== 回滚完成 ==="
  environment:
    name: production/frontend
    action: rollback
  only:
    - main
  tags:
    - kubernetes
  when: manual
  timeout: "15m"

# ============================================================
# 健康检查
# ============================================================

healthcheck:staging:
  stage: deploy-staging
  image: curlimages/curl:latest
  allow_failure: true
  before_script:
    - echo "=== Staging 健康检查 ==="
  script:
    - |
      STAGING_URL="https://staging.chat.toy"
      echo "检查: $STAGING_URL/health"
      sleep 30
      for i in {1..10}; do
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $STAGING_URL/health || echo "000")
        echo "尝试 $i: HTTP $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ]; then
          echo "健康检查通过!"
          exit 0
        fi
        sleep 10
      done
      echo "健康检查失败"
      exit 1
  needs:
    - deploy:staging:backend
    - deploy:staging:frontend
  only:
    - main
    - develop
  tags:
    - docker

healthcheck:production:
  stage: deploy-production
  image: curlimages/curl:latest
  allow_failure: false
  before_script:
    - echo "=== Production 健康检查 ==="
  script:
    - |
      PROD_URL="https://chat.toy"
      echo "检查: $PROD_URL/health"
      sleep 60
      for i in {1..15}; do
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $PROD_URL/health || echo "000")
        echo "尝试 $i: HTTP $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ]; then
          echo "健康检查通过!"
          exit 0
        fi
        sleep 10
      done
      echo "健康检查失败，将触发回滚"
      exit 1
  needs:
    - deploy:production:backend
    - deploy:production:frontend
  only:
    - main
  tags:
    - docker
  when: manual

# ============================================================
# 通知
# ============================================================

notify:pipeline:failure:
  stage: .post
  image: node:20-alpine
  before_script:
    - npm install -g slack-notify 2>/dev/null || true
  script:
    - |
      if [ -n "$SLACK_WEBHOOK_URL" ]; then
        curl -X POST $SLACK_WEBHOOK_URL \
          -H 'Content-type: application/json' \
          --data '{"text": "GitLab CI Pipeline Failed: '"$CI_PIPELINE_URL"' ('"$CI_COMMIT_REF_NAME"')"}'
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
  only:
    - main
    - develop
  tags:
    - docker

notify:deployment:success:
  stage: .post
  image: node:20-alpine
  before_script:
    - npm install -g slack-notify 2>/dev/null || true
  script:
    - |
      if [ -n "$SLACK_WEBHOOK_URL" ]; then
        curl -X POST $SLACK_WEBHOOK_URL \
          -H 'Content-type: application/json' \
          --data '{"text": "Deployment Success: '"$CI_COMMIT_REF_NAME"' -> '"$CI_ENVIRONMENT_NAME"'"}'
      fi
  environment:
    name: production/backend
    url: https://chat.toy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  only:
    - main
  tags:
    - docker

# ============================================================
# 定时任务
# ============================================================

security:daily-scan:
  stage: security
  image: aquasec/trivy:latest
  allow_failure: true
  before_script:
    - chmod 555 $CI_SERVER_URL
  script:
    - |
      echo "=== 每日安全扫描 ==="
      trivy image --format json --output "daily-security-report.json" --exit-code 0 \
        ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/backend:latest || true
      trivy image --format json --output "daily-frontend-security-report.json" --exit-code 0 \
        ${DOCKER_REGISTRY}/${DOCKER_IMAGE_PREFIX}/frontend:latest || true
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - daily-security-report.json
      - daily-frontend-security-report.json
  only:
    - schedule
  when: daily

# ============================================================
# 前后置脚本
# ============================================================
before_script:
  - echo "=== CI/CD Pipeline Started ==="
  - echo "Project: $CI_PROJECT_NAME"
  - echo "Branch: $CI_COMMIT_REF_NAME"
  - echo "Commit: $CI_COMMIT_SHORT_SHA"

after_script:
  - echo "=== CI/CD Pipeline Finished ==="
  - echo "Duration: $CI_PIPELINE_DURATION seconds"