# AI Chat 玩具 - Go 版本 Docker Compose

version: '3.8'

services:
  # 后端服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-chat-app
    ports:
      - "30000:30000"
    environment:
      - APP_ENV=production
      - APP_SERVER_PORT=30000
      - APP_SERVER_MODE=release
      - DATABASE_URL=postgres://gagent:password@postgres:5432/gagent?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=qdrant:6334
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimaxi.com/anthropic}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M2.7}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-chat-network

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ai-chat-postgres
    environment:
      - POSTGRES_USER=gagent
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=gagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/infra/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-chat-network
    restart: unless-stopped

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: ai-chat-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-chat-network
    restart: unless-stopped

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-chat-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-chat-network
    restart: unless-stopped

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ai-chat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - ai-chat-network
    restart: unless-stopped

networks:
  ai-chat-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  qdrant_data:
