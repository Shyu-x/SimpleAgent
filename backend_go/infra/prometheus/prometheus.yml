# Prometheus 配置文件
# AI Chat 玩具 - Go 版本

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager 配置（可选）
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# 规则文件（可选）
rule_files: []

# 抓取配置
scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 后端服务
  - job_name: 'ai-chat-backend'
    static_configs:
      - targets: ['backend:30000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis（如果启用redis_exporter）
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Qdrant（如果启用）
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    scrape_interval: 30s
