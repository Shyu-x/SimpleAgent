# ==========================================
# AI Chat 玩具 - E2E 测试 Docker 配置
# ==========================================

version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-builder
    container_name: aichat-test-frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=test
      - NEXT_PUBLIC_BACKEND_URL=http://backend:30000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: aichat-test-backend
    ports:
      - "30000:30000"
    environment:
      - NODE_ENV=test
      - PORT=30000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:30000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Playwright 测试
  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0
    container_name: aichat-test-runner
    working_dir: /app
    volumes:
      - .:/app
      - test-results:/app/test-results
    environment:
      - TEST_BASE_URL=http://frontend:5173
      - TEST_BACKEND_URL=http://backend:30000
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 10 &&
        echo 'Running E2E tests...' &&
        npx playwright test --reporter=list
      "
    depends_on:
      - frontend
      - backend

volumes:
  test-results:
    driver: local
