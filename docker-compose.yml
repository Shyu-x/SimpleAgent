# ==========================================
# SimpleAgent Docker Compose 配置
# ==========================================
# 快速启动:
#   1. cp backend/.env.example backend/.env  # 复制并配置环境变量
#   2. docker-compose up -d --build          # 构建并启动所有服务
#   3. 访问 http://localhost:3001            # 前端地址
# ==========================================

version: '3.8'

services:
  # -----------------------------
  # 前端服务 (Next.js)
  # -----------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        - NODE_ENV=production
    container_name: simpleagent-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_BACKEND_URL=http://backend:30000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - simpleagent-network
    depends_on:
      backend:
        condition: service_healthy

  # -----------------------------
  # 后端服务 (Node.js Express API)
  # -----------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        - NODE_ENV=production
    container_name: simpleagent-backend
    ports:
      - "30000:30000"
    environment:
      - NODE_ENV=production
      - PORT=30000
      - LOG_LEVEL=info
      # MiniMax API（必需）
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      # 向量数据库配置
      - VECTOR_DB_TYPE=${VECTOR_DB_TYPE:-memory}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-chat_documents}
      - QDRANT_DIMENSION=${QDRANT_DIMENSION:-1024}
      # RAG 配置
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-512}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_RERANK=${RAG_RERANK:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:30000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - simpleagent-network

  # -----------------------------
  # Qdrant 向量数据库服务
  # -----------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: simpleagent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - simpleagent-network

# -----------------------------
# 数据卷
# -----------------------------
volumes:
  qdrant_data:
    driver: local

# -----------------------------
# 网络
# -----------------------------
networks:
  simpleagent-network:
    name: simpleagent-network
    driver: bridge
