# ==========================================
# AI Chat 玩具 - Docker Compose 配置
# ==========================================
# 快速启动:
#   1. cp .env.example .env  # 复制并配置环境变量
#   2. docker-compose up -d  # 启动所有服务
#   3. 访问 http://localhost:8080
# ==========================================

services:
  # -----------------------------
  # 前端服务 (Next.js)
  # -----------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-builder
    container_name: ai-chat-frontend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:30000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -----------------------------
  # 后端服务 (Node.js API)
  # -----------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: ai-chat-backend
    ports:
      - "30000:30000"
    environment:
      - NODE_ENV=production
      - PORT=30000
      # Qdrant 向量数据库
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=chat_documents
      - QDRANT_DIMENSION=1024
      # RAG 配置
      - RAG_CHUNK_SIZE=512
      - RAG_TOP_K=5
      - RAG_RERANK=true
      # MiniMax API（必需）
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # -----------------------------
  # Backend-Nest 服务 (NestJS)
  # -----------------------------
  backend-nest:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    container_name: ai-chat-backend-nest
    ports:
      - "30001:30001"
    environment:
      - NODE_ENV=production
      - PORT=30001
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy

  # -----------------------------
  # Redis 缓存服务
  # -----------------------------
  redis:
    image: redis:7-alpine
    container_name: aichat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ai-chat-network

  # -----------------------------
  # Qdrant 向量数据库服务
  # -----------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aichat-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ai-chat-network

# -----------------------------
# 数据卷
# -----------------------------
volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local

# -----------------------------
# 网络
# -----------------------------
networks:
  ai-chat-network:
    name: ai-chat-network
    driver: bridge
