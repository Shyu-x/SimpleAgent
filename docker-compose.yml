# ==========================================
# AI 对话平台 - Docker Compose 配置
# ==========================================
# 快速启动:
#   1. cp .env.example .env  # 复制并配置环境变量
#   2. docker-compose up -d # 启动所有服务
#   3. 访问 http://localhost:3000
# ==========================================

services:
  # -----------------------------
  # 前端服务 (Next.js)
  # -----------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-builder
    container_name: ai-chat-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_INTERNAL_URL=http://backend:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -----------------------------
  # 后端服务 (Node.js API)
  # -----------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: ai-chat-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      # 从 .env 文件加载（需要创建）
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
      - postgres

  # -----------------------------
  # PostgreSQL with pgvector (使用非标准端口 54320)
  # -----------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aichat-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat123
      POSTGRES_DB: aichat
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  # -----------------------------
  # Redis 缓存服务（可选，使用非标准端口 6380）
  # -----------------------------
  redis:
    image: redis:7-alpine
    container_name: aichat-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  # -----------------------------
  # Ollama 向量模型服务 (CPU模式 - WSL GPU问题)
  # -----------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: aichat-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU配置已禁用 (WSL环境GPU直通问题)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_HOST: 0.0.0.0:11434
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------
  # Nginx 反向代理
  # -----------------------------
  nginx:
    image: nginx:alpine
    container_name: ai-chat-nginx
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - default

# -----------------------------
# 数据卷
# -----------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

# -----------------------------
# 网络
# -----------------------------
networks:
  default:
    name: ai-chat-network
