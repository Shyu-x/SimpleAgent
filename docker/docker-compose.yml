# ============================================
# SimpleAgent Docker Compose (Production)
# ============================================
#
# 方式1: 使用预构建镜像 (推荐)
# docker pull ghcr.io/shyu-x/simpleagent/backend:latest
# docker pull ghcr.io/shyu-x/simpleagent/frontend:latest
#
# 方式2: 本地构建
# docker-compose build
# docker-compose up -d
#
# 环境变量:
# MINIMAX_API_KEY - MiniMax API 密钥
# VECTOR_DB_TYPE  - qdrant 或 memory
#
version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: simpleagent-backend
    ports:
      - "30000:30000"
    environment:
      - NODE_ENV=production
      - PORT=30000
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - VECTOR_DB_TYPE=${VECTOR_DB_TYPE:-memory}
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: simpleagent-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_BACKEND_URL=http://backend:30000
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: simpleagent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data: