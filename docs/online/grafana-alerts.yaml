groups:
  - name: simpleagent-critical
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 1)
          > 0.01
        for: 5m
        labels:
          severity: critical
          service: simpleagent
        annotations:
          summary: "5xx 错误率 > 1% 持续 5 分钟"
          description: "当前错误率 {{ $value | humanizePercentage }}, 立即排查后端日志"
          runbook: "docs/online/RUNBOOK.md#r-1-服务挂"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 3
        for: 5m
        labels:
          severity: warning
          service: simpleagent
        annotations:
          summary: "P95 延迟 > 3s 持续 5 分钟"
          description: "当前 P95 {{ $value }}s, 可能是 MiniMax 慢或限流"

      - alert: HeapTooHigh
        expr: nodejs_heap_size_used_bytes > 524288000
        for: 10m
        labels:
          severity: warning
          service: simpleagent
        annotations:
          summary: "Node Heap > 500MB 持续 10 分钟"
          description: "当前 {{ $value | humanize1024 }}B, 可能内存泄漏"
          runbook: "docs/online/RUNBOOK.md#r-7-内存泄漏"

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 1
        for: 2m
        labels:
          severity: critical
          service: simpleagent
        annotations:
          summary: "Circuit Breaker 打开"
          description: "实例 {{ $labels.name }} 已熔断, 检查依赖服务"

      - alert: MiniMaxErrors
        expr: |
          sum(rate(model_errors_total[5m])) * 60 > 10
        for: 3m
        labels:
          severity: warning
          service: simpleagent
        annotations:
          summary: "MiniMax 4xx/5xx 突增 > 10/min"
          description: "可能 API key 失效或配额耗尽"
          runbook: "docs/online/RUNBOOK.md#r-2-minimax-401429"

      - alert: QueueBacklog
        expr: queue_length > 100
        for: 5m
        labels:
          severity: warning
          service: simpleagent
        annotations:
          summary: "队列堆积 > 100"
          description: "可能下游处理慢或消费者挂掉"

      - alert: RateLimitHigh
        expr: |
          sum by (tier) (rate(rate_limit_exceeded_total[5m])) * 60 > 50
        for: 5m
        labels:
          severity: info
          service: simpleagent
        annotations:
          summary: "限流触发频繁 (tier={{ $labels.tier }})"
          description: "可能客户端失控或 DDoS"

  - name: simpleagent-info
    interval: 60s
    rules:
      - alert: NoTraffic
        expr: sum(rate(http_requests_total[5m])) * 60 < 0.1
        for: 10m
        labels:
          severity: info
          service: simpleagent
        annotations:
          summary: "10 分钟内无流量"
          description: "可能服务全挂或客户端断连"
